<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sign In · Bookkeeper Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F8F4ED; --cream-soft:#FCFAF5; --cream-warm:#F3EDE0;
    --ink:#0F1B2F; --ink-mid:#4A5468;
    --coral:#E8765E; --coral-dark:#C95A47;
    --teal:#5B9B96; --gold:#E89B2D;
    --line:#E5DDD0;
    --serif:'Fraunces',Georgia,serif;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--sans);background:var(--cream);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;line-height:1.55;-webkit-font-smoothing:antialiased}

  .card{width:100%;max-width:440px;background:var(--cream-soft);border:1px solid var(--line);border-radius:24px;padding:48px 38px;box-shadow:0 18px 50px rgba(15,27,47,0.10);text-align:center}
  .logo{font-size:42px;margin-bottom:14px}
  h1{font-family:var(--serif);font-size:30px;font-weight:800;color:var(--ink);margin-bottom:6px;letter-spacing:-0.01em}
  .lede{color:var(--ink-mid);font-size:14px;margin-bottom:28px}

  form{text-align:left}
  .field{margin-bottom:14px}
  label{display:block;font-size:12px;font-weight:700;color:var(--ink);margin-bottom:6px;letter-spacing:.3px;text-transform:uppercase}
  input{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit;background:#fff;transition:all .15s}
  input:focus{outline:none;border-color:var(--coral);box-shadow:0 0 0 3px rgba(232,118,94,.12)}

  .btn{width:100%;padding:14px;background:var(--coral);color:#fff;border:none;border-radius:999px;font-size:14px;font-weight:700;cursor:pointer;margin-top:8px;letter-spacing:.5px;transition:all .15s;box-shadow:0 6px 18px rgba(232,118,94,.30);font-family:inherit}
  .btn:hover{background:var(--coral-dark);transform:translateY(-1px)}

  .msg{padding:12px 14px;border-radius:10px;font-size:13px;margin-top:14px;display:none}
  .msg.ok{background:#E0F2F1;color:#00695C;border:1px solid #80CBC4;display:block}
  .msg.err{background:#FFEBEE;color:#C62828;border:1px solid #EF9A9A;display:block}

  .footer{margin-top:22px;padding-top:18px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-mid);line-height:1.55}
  .footer a{color:var(--coral);font-weight:600;text-decoration:none}
  .footer a:hover{text-decoration:underline}
  .home{font-size:12px;color:var(--ink-mid);text-decoration:none;display:inline-block;margin-bottom:18px}
  .home:hover{color:var(--ink)}
</style>
</head>
<body>

<div class="card">
  <a class="home" href="index.html">← back to linktree</a>
  <div class="logo">📗</div>
  <h1>Bookkeeper Academy</h1>
  <p class="lede">Sign in to unlock the full Academy.</p>

  <form onsubmit="event.preventDefault();doSignIn()">
    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" required placeholder="bookkeeperacademy" autocomplete="username">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password">
    </div>
    <button type="submit" class="btn">Sign In →</button>
    <div class="msg" id="msg"></div>
  </form>

  <div class="footer">
    Need a login? Email Mary at <a href="mailto:marygrace.solayao01@gmail.com">marygrace.solayao01@gmail.com</a> or DM <a href="https://www.instagram.com/mgsolayao0198/" target="_blank">@mgsolayao</a> on Instagram.
  </div>
</div>

<script>
  /* ── Single shared credential ── */
  const USERNAME = 'bookkeeperacademy';
  const PASSWORD = 'mg2026';

  function doSignIn() {
    const u = document.getElementById('username').value.trim().toLowerCase();
    const p = document.getElementById('password').value;
    const m = document.getElementById('msg');

    if (u !== USERNAME || p !== PASSWORD) {
      m.className = 'msg err';
      m.textContent = 'Incorrect username or password. Please try again.';
      return;
    }

    localStorage.setItem('academy_access', 'granted');
    localStorage.setItem('academy_unlocked_at', new Date().toISOString());

    m.className = 'msg ok';
    m.textContent = '✓ Welcome! Opening the Academy…';
    setTimeout(() => { window.location.href = 'academy.html'; }, 600);
  }

  // If already signed in, show a shortcut
  if (localStorage.getItem('academy_access') === 'granted') {
    document.querySelector('.lede').innerHTML =
      '✓ You\'re already signed in. <a href="academy.html" style="color:#E8765E;font-weight:700">Open Academy →</a> · ' +
      '<a href="#" onclick="localStorage.removeItem(\'academy_access\');location.reload();return false;" style="color:#C62828;font-size:11px">sign out</a>';
  }
</script>

</body>
</html>
